# Déploiement Render : un seul service qui sert le site et le serveur (WebSocket compris).
# Mode « test d'équipe » : stockage en mémoire (les données sont effacées à chaque redémarrage).
# Pour garder les données : crée une base PostgreSQL sur Render et ajoute DATABASE_URL.
services:
  - type: web
    name: koradevs
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: SOS_SERVE_WEB
        value: "1"
      - key: SOS_ALLOW_MEMORY
        value: "1"
      # Garde la connexion par pseudo tant que GitHub n'est pas configuré. Mets "0" ensuite.
      - key: SOS_DEV_AUTH
        value: "1"
      # Connexion GitHub : voir README (section « Connexion GitHub sur le site »).
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # L'adresse publique du service, par exemple https://koradevs.onrender.com (sans / à la fin).
      - key: SOS_WEB_URL
        sync: false
